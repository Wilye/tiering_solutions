############
### SILO ###
############

# numa-memory should be set to the RSS of the workload
# This is why Silo will allocate this much size as huge pages, that can be handled by HeMem
# -- Note that if set *more* than RSS, there many not be enough DRAM pages for HeMem (i.e., pebs.c !"Out of Memory")
# -- Note that if set *less* than RSS, Silo will aborted (i.e., region ending at <address> OOM)

## Silo-TPCC
## RSS: 75.68 GiB
# Total 120M operations (i.e., 10M / thread)
[workload.silo-tpcc-scailp]
run_command_template = '${source_path}/silo/out-perf.masstree/benchmarks/dbtest --verbose --bench tpcc --num-threads ${num_threads} --scale-factor 100 --ops-per-worker 10000000 --numa-memory ${RSS}'
target_metric = "elapsed_time"

    [workload.silo-tpcc-scailp.mem_ratio]
    1-8 = { dram_size_gib = 8.41, nvm_size_gib = 67.27 }

