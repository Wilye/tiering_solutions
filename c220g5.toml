
# General settings
timeout_multiplier = 3
mem_size_alignment_bytes = 2097152 # 2MiB
nvm_size_extra_gib = 8 # Extra NVM size to avoid HeMem crashing

[optimizer]
num_iters = 100
n_random_init = 20
n_random_probability = 0.2
warmup_iters = 3

[engine]

[engine.hmsdk]
source_path = '/users/SujayYS/hmsdk'
run_command_template = 'sudo cgexec -g memory:hmsdk numactl -N0 -- taskset -c 0-9,20-25 sudo ${env} ${workload_run_command} > ${workload_output_filepath} 2>&1'
dram_extra_gib = 0.700 # account for watermak in NUMA systems (713 MiB for c220g5 observed when using memchew)
metrics_interval_secs = 15

[engine.hemem]
source_path = '/usr/local/hemem/src'
run_command_template = 'numactl -N0 -m0 -- taskset -c 0-9,20-25 sudo ${env} ${workload_run_command} > ${workload_output_filepath} 2>&1'


[workload]
num_threads = 16
source_path = "/mnt/ssd/workloads"
dataset_path = "/mnt/ssd/inputs"

logging_output_filepath = "/tmp/logging_output.log"

# Currently valid template placeholders for workload run commands are:
# - ${source_path}
# - ${dataset_path}
# - ${num_thread}


##############################
### Betweenness Centrality ###
##############################

## GapBS: Betweenness Centrality (kron-s29)
# RSS: 78.13 GiB
# NOTE: 1/2 of default trials to reduce opt iter time
[workload.bc]
run_command_template = '${source_path}/gapbs/bc -n 8 -f ${dataset_path}/gapbs/kron_s29.sg'
env_vars = { OMP_NUM_THREADS = '${num_threads}' }
target_metric = "elapsed_time"

    [workload.bc.mem_ratio]
    1-8 = { dram_size_gib = 8.68, nvm_size_gib = 69.45 }

